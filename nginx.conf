events {}

http {

    limit_req_zone $binary_remote_addr zone=redirect_limit:10m rate=20r/s;

    upstream shortener_backend {
        server host.docker.internal:8081;
    }

    server {
        listen 80;

        # =========================
        # 1️⃣ POST API: create short URL
        # =========================
        location /api/ {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_pass http://shortener_backend;
        }

        # =========================
        # 2️⃣ GET redirect: /{shortKey}
        # =========================
        location / {
            limit_req zone=redirect_limit burst=40;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Rewrite only for shortKey
            rewrite ^/([^/]+)$ /api/v1/shorten/$1 break;

            proxy_pass http://shortener_backend;
        }
    }
}
